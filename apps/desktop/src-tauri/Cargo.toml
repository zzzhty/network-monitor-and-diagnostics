[package]
name = "nmd-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "NMD desktop shell: tray, notifications and lifecycle for the local dashboard"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
signal-hook = "0.3"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"

[dev-dependencies]
tempfile = "3"

[Unit]
After=tailscaled.service systemd-resolved.service
Wants=systemd-resolved.service

[Service]
ExecStartPre=/usr/bin/mihomo -t -d /etc/mihomo
# Also runs after abnormal exit; the kernel removes the non-persistent TUN.
# Do not delete Tailscale rules/table 52 or change its login/exit-node state.
ExecStopPost=/usr/bin/resolvectl flush-caches

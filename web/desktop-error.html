<h1>本地面板未能启动</h1>
<p>请检查窗口标题中的原因。确认 NMD CLI 已安装；自定义安装时，将 <code>nmd</code> 放在桌面程序同一目录，或确保它位于 PATH 中。</p>
<p>也可在终端运行 <code>nmd gui</code> 查看启动错误。检查本地端口 8765–8796 是否可用，再选择重试。重试仅重新连接或启动本地面板；不会启动监控或修改网络设置。</p>
<p>此错误页面随程序提供，无需访问任何远端页面。</p>

<a href="nmd-startup://quit">退出</a>
